services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novaterra-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - novaterra-network
    restart: unless-stopped

  db:
    image: mariadb:latest
    container_name: novaterra-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-rootpassword}}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-${MYSQL_DATABASE:-novaterra}}
      MARIADB_USER: ${MARIADB_USER:-${MYSQL_USER:-novaterra}}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-${MYSQL_PASSWORD:-novaterrapass}}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - novaterra-network
    restart: unless-stopped
    command: --sql_mode=""
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: novaterra-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${MYSQL_ROOT_PASSWORD:-rootpassword}}
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - novaterra-network
    restart: unless-stopped

volumes:
  db-data:
    driver: local

networks:
  novaterra-network:
    driver: bridge
